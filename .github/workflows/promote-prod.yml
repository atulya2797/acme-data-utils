name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to promote (e.g. 1.1.6)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://cloudsmith.io/~${{ vars.CLOUDSMITH_ORG }}/repos/acme-pypi-prod/

    permissions:
      contents: read
      id-token: write   # required for OIDC

    steps:
      - name: Obtain short-lived Cloudsmith token via OIDC
        id: cs-token
        run: |
          OIDC_TOKEN=$(curl -sSfL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://cloudsmith" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          CS_TOKEN=$(curl -sSf \
            -X POST "https://api.cloudsmith.io/v1/orgs/${{ vars.CLOUDSMITH_ORG }}/oidc/${{ vars.CLOUDSMITH_OIDC_SLUG }}/" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\":\"$OIDC_TOKEN\",\"service_slug\":\"acme-prod-promoter\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          echo "::add-mask::$CS_TOKEN"
          echo "token=$CS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Find package identifier in QA
        id: find-pkg
        run: |
          SLUG=$(cloudsmith list packages \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa \
            --query "name:acme-data-utils version:${{ github.event.inputs.version }}" \
            -F json \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          packages = data if isinstance(data, list) else data.get('data', [])
          for p in packages:
              if p.get('extension') == '.whl' and p.get('is_copyable'):
                  print(p['identifier_perm'])
                  break
          ")

          if [ -z "$SLUG" ]; then
            echo "ERROR: No copyable .whl found in QA for version ${{ github.event.inputs.version }}"
            exit 1
          fi

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Found package: $SLUG"
        env:
          CLOUDSMITH_API_KEY: ${{ steps.cs-token.outputs.token }}

      - name: Copy package from QA → Production
        run: |
          cloudsmith copy \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa/${{ steps.find-pkg.outputs.slug }} \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-prod
        env:
          CLOUDSMITH_API_KEY: ${{ steps.cs-token.outputs.token }}

      - name: Announce promotion
        run: |
          echo "🚀  acme-data-utils==${{ github.event.inputs.version }} promoted to Production."
          echo "Approved by: ${{ github.actor }}"
          echo "Install with:"
          echo "  pip install acme-data-utils==${{ github.event.inputs.version }} \\"
          echo "    --index-url https://dl.cloudsmith.io/basic/${{ vars.CLOUDSMITH_ORG }}/acme-pypi-prod/python/simple/"