name: Promote to Production
# Manual workflow — a reviewer must trigger this and supply the version to
# promote.  GitHub Environments enforce the required reviewer gate, replacing
# the GitLab CI `when: manual` job.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to promote (e.g. 0.1.0)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://cloudsmith.io/~${{ vars.CLOUDSMITH_ORG }}/repos/acme-pypi-prod/

    permissions:
      contents: read

    steps:
      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Find package identifier in QA
        id: find-pkg
        run: |
          SLUG=$(cloudsmith list packages \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa \
            --query "name:acme-data-utils version:${{ github.event.inputs.version }}" \
            -F json \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          packages = data if isinstance(data, list) else data.get('data', [])
          for p in packages:
              if p.get('extension') == '.whl' and p.get('is_copyable'):
                  print(p['identifier_perm'])
                  break
          ")

          if [ -z "$SLUG" ]; then
            echo "ERROR: No copyable .whl found in QA for version ${{ github.event.inputs.version }}"
            exit 1
          fi

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Found package: $SLUG"
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Copy package from QA → Production
        run: |
          cloudsmith copy \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa/${{ steps.find-pkg.outputs.slug }} \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-prod
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Announce promotion
        run: |
          echo "🚀  acme-data-utils==${{ github.event.inputs.version }} has been promoted to Production."
          echo "Approved by: ${{ github.actor }}"
          echo "Install with:"
          echo "  pip install acme-data-utils==${{ github.event.inputs.version }} \\"
          echo "    --index-url https://dl.cloudsmith.io/basic/${{ vars.CLOUDSMITH_ORG }}/acme-pypi-prod/python/simple/"