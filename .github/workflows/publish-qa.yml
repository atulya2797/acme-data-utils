name: Publish to QA

# Publishes acme-data-utils to the Cloudsmith QA repository on every
# push to master, but only after CI passes (uses needs: ci).
on:
  push:
    branches: [master]

jobs:
  # ── 1. Re-run CI so we never publish a broken build ─────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── 2. Publish to QA ────────────────────────────────────────────────────────
  publish-qa:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: cloudsmith-qa
      url: https://cloudsmith.io/~${{ vars.CLOUDSMITH_ORG }}/repos/acme-pypi-qa/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        working-directory: acme-data-utils
        run: |
          pip install --upgrade pip build
          rm -rf dist/
          python -m build

      - name: Push wheel to Cloudsmith QA
        working-directory: acme-data-utils
        run: |
          pip install cloudsmith-cli
          cloudsmith push python \
            ${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa \
            dist/*.whl
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Announce QA package availability
        run: |
          VERSION=$(python3 -c "import tomllib; \
            d=tomllib.load(open('acme-data-utils/pyproject.toml','rb')); \
            print(d.get('project',{}).get('version','unknown'))" 2>/dev/null \
            || grep -m1 'version' acme-data-utils/setup.cfg | awk -F= '{print $2}' | tr -d ' ')
          echo "✅  acme-data-utils==${VERSION} is now available in the QA repository."
          echo "Install with:"
          echo "  pip install acme-data-utils==${VERSION} \\"
          echo "    --index-url https://dl.cloudsmith.io/basic/${{ vars.CLOUDSMITH_ORG }}/acme-pypi-qa/python/simple/"