name: CI — Build & Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for OIDC token

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "acme-data-utils/pyproject.toml"

      - name: Install build tools
        run: pip install --upgrade pip build pytest

      - name: Build package
        working-directory: acme-data-utils
        run: |
          rm -rf dist/
          python -m build

      - name: Install built wheel & run tests
        working-directory: acme-data-utils
        run: |
          pip install dist/*.whl
          pytest tests/ -v --tb=short

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ github.sha }}
          path: acme-data-utils/dist/
          retention-days: 7
